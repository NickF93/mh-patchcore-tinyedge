[project]
name = "mh-patchcore-tinyedge"
version = "0.1.0"
description = "Tiny edge anomaly scoring with compact PatchCore-style memory banks."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "rich>=13.0",
  "torch>=2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
mh-tinyedge = "mh_patchcore_tinyedge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
